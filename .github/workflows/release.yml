name: Release

# 打 tag 触发发布（tag 形如 v2.0.0）。
# npm 上只发 3 个包：-vue / -react / -angular（core 与 ui 是 private，已内联进三者，不单独发）。
# 版本号统一由 `pnpm version:set` 维护，tag 必须与 package.json 的 version 一致。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # 创建 GitHub Release
  id-token: write # 如需 npm provenance 必须开启

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        # 不要写 with.version：根 package.json 已有 packageManager: "pnpm@11.7.0"，
        # 两处都指定会直接报 ERR_PNPM_BAD_PM_VERSION（Multiple versions of pnpm specified），
        # 整条流水线会卡在这一步。版本统一以 packageManager 为准。

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # 让 npm 从 NODE_AUTH_TOKEN 读取凭证（写入临时 .npmrc）
          registry-url: https://registry.npmjs.org

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 校验 tag 与包版本一致
        # 防止「打了 v1.0.1 的 tag，但 package.json 还是 1.0.0」导致重复发布失败
        run: |
          node -e "
          const fs = require('fs');
          const v = JSON.parse(fs.readFileSync('packages/core/package.json')).version;
          const t = process.env.GITHUB_REF_NAME.replace(/^v/, '');
          if (v !== t) {
            console.error('tag ' + t + ' 与包版本 ' + v + ' 不一致');
            process.exit(1);
          }
          console.log('版本校验通过:', v);
          "

      - name: 构建
        run: pnpm build

      - name: 发布到 npm
        # pnpm publish 没有「跳过已存在版本」的开关，版本重复时 registry 直接返回 403，
        # 整条流水线会红掉。所以先逐个查 registry，已存在就跳过，再发没有的。
        # 好处：重跑 job 安全；某个包已在本地手动发过也不会卡住；三个包互不依赖，失败可单点重试。
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for pkg in vue react angular; do
            dir="packages/$pkg"
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            # npm view 走公共读接口，无需 token；能读到说明该版本已发布过
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "跳过 $name@$version（registry 上已存在）"
              continue
            fi
            echo "发布 $name@$version"
            # --no-git-checks：dist/ 是被 .gitignore 忽略的构建产物，publish 时必须放行
            (cd "$dir" && pnpm publish --access public --no-git-checks)
          done

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            对应 npm 包（同一版本号）：

            - `@laoliangfe/annotation-overlay-vue`
            - `@laoliangfe/annotation-overlay-react`
            - `@laoliangfe/annotation-overlay-angular`

            引擎（core）与样式（ui）是内部包，已内联进上述三个包，不单独发布。

            在线演示与文档：https://love2157dream.github.io/annotation-overlay/
